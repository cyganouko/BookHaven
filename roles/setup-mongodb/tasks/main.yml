---
- name: Ensure MongoDB data directory exists
  ansible.builtin.file:
    path: "{{ mongo_data_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure BookHaven Docker network exists
  community.docker.docker_network:
    name: "{{ mongo_network }}"
    state: present

- name: Ensure MongoDB image is available
  community.docker.docker_image:
    name: "{{ mongo_image }}"
    source: pull
    state: present

- name: Run MongoDB container
  community.docker.docker_container:
    name: "{{ mongo_container_name }}"
    image: "{{ mongo_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ mongo_port }}:27017"
    volumes:
      - "{{ mongo_data_path }}:/data/db"
    networks:
      - name: "{{ mongo_network }}"

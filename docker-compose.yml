services:
  mongodb:
    image: mongo:7
    container_name: bookhaven-mongodb
    restart: unless-stopped
    volumes:
      - bookhaven-mongo-data:/data/db
    networks:
      - bookhaven-network

  backend:
    image: bookhaven-backend:0.1.0
    container_name: bookhaven-backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/bookhaven
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - mongodb
    ports:
      - "5001:5000"
    networks:
      - bookhaven-network

  frontend:
    image: bookhaven-frontend:0.1.0
    container_name: bookhaven-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - bookhaven-network

volumes:
  bookhaven-mongo-data:

networks:
  bookhaven-network:
    driver: bridge

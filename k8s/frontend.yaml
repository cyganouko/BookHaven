apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookhaven-frontend
  labels:
    app: bookhaven
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookhaven
      component: frontend
  template:
    metadata:
      labels:
        app: bookhaven
        component: frontend
    spec:
      containers:
        - name: frontend
          image: cyganouko/bookhaven-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bookhaven-frontend
  labels:
    app: bookhaven
    component: frontend
spec:
  type: LoadBalancer
  selector:
    app: bookhaven
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

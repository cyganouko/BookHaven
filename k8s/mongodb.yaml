apiVersion: v1
kind: Service
metadata:
  name: bookhaven-mongodb
  labels:
    app: bookhaven
    component: mongodb
spec:
  clusterIP: None
  selector:
    app: bookhaven
    component: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bookhaven-mongodb
  labels:
    app: bookhaven
    component: mongodb
spec:
  serviceName: bookhaven-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: bookhaven
      component: mongodb
  template:
    metadata:
      labels:
        app: bookhaven
        component: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
        labels:
          app: bookhaven
          component: mongodb
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

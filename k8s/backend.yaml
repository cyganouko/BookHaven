apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookhaven-backend
  labels:
    app: bookhaven
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookhaven
      component: backend
  template:
    metadata:
      labels:
        app: bookhaven
        component: backend
    spec:
      containers:
        - name: backend
          image: cyganouko/bookhaven-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: MONGODB_URI
              value: "mongodb://bookhaven-mongodb:27017/bookhaven"
            - name: PORT
              value: "5000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bookhaven-backend
  labels:
    app: bookhaven
    component: backend
spec:
  type: ClusterIP
  selector:
    app: bookhaven
    component: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
